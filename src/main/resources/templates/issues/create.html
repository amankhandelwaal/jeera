<!DOCTYPE html>
<html lang="en"
			xmlns:th="http://www.thymeleaf.org"
			th:replace="~{layout/base :: layout('Create Issue', ~{::section})}">
<section>
	<div class="row justify-content-center">
		<div class="col-12 col-lg-9 col-xl-8">
			<div class="jeera-card p-4 p-md-5">
				<div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-2">
					<div>
						<h1 class="h4 mb-1">Report New Issue</h1>
						<p class="jeera-muted mb-0">Capture bug or enhancement details for this project.</p>
					</div>
					<a class="btn btn-outline-secondary btn-sm"
						 th:href="@{/projects/{id}/issues(id=${createIssueDto.projectId})}">Back to project issues</a>
				</div>

				<form th:action="@{/projects/{id}/issues/new(id=${createIssueDto.projectId})}"
							th:object="${createIssueDto}"
							method="post"
							novalidate>

					<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<input type="hidden" th:field="*{projectId}">

					<div class="mb-3">
						<label for="title" class="form-label fw-semibold">Title</label>
						<input id="title"
									 type="text"
									 class="form-control"
									 th:field="*{title}"
									 th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'"
									 maxlength="180"
									 placeholder="Summarize the issue in one line">
						<div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
							<div class="form-text">Keep it concise and specific for faster triage.</div>
					</div>

					<div class="mb-3">
						<label for="description" class="form-label fw-semibold">Description</label>
						<textarea id="description"
											rows="6"
											class="form-control"
											th:field="*{description}"
											th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"
											placeholder="Steps to reproduce, expected behavior, actual behavior"></textarea>
						<div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Description error</div>
					</div>

					<div class="row g-3 mb-4">
						<div class="col-12 col-md-6">
							<label for="type" class="form-label fw-semibold">Type</label>
							<select id="type"
											class="form-select"
											th:field="*{type}"
											th:classappend="${#fields.hasErrors('type')} ? ' is-invalid'">
								<option value="">Select type</option>
								<option th:each="type : ${T(com.jeera.model.enums.IssueType).values()}"
												th:value="${type}"
												th:text="${type}">TYPE</option>
							</select>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Type error</div>
						</div>
						<div class="col-12 col-md-6">
							<label for="priority" class="form-label fw-semibold">Priority</label>
							<select id="priority"
											class="form-select"
											th:field="*{priority}"
											th:classappend="${#fields.hasErrors('priority')} ? ' is-invalid'">
								<option value="">Select priority</option>
								<option th:each="priority : ${T(com.jeera.model.enums.IssuePriority).values()}"
												th:value="${priority}"
												th:text="${priority}">PRIORITY</option>
							</select>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}">Priority error</div>
						</div>
					</div>

					<div class="d-flex flex-wrap gap-2">
						<button type="submit" class="btn btn-primary">Create issue</button>
						<a class="btn btn-outline-secondary"
							 th:href="@{/projects/{id}/issues(id=${createIssueDto.projectId})}">Cancel</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</section>
</html>
