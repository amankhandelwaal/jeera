# ─────────────────────────────────────────────────────────────────────────────
# Production profile (Render). Activate with SPRING_PROFILES_ACTIVE=prod.
# Contains NO secrets — all credentials come from environment variables.
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Behind Render's proxy, honour X-Forwarded-* so absolute URLs / https are correct.
server.forward-headers-strategy=framework

# Flyway owns the schema; Hibernate only validates against the migrated DB.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

logging.level.root=INFO
