# ─────────────────────────────────────────────────────────────────────────────
# Production profile (Render). Activate with SPRING_PROFILES_ACTIVE=prod.
# Contains NO secrets — all credentials come from environment variables.
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Behind Render's proxy, honour X-Forwarded-* so absolute URLs / https are correct.
server.forward-headers-strategy=framework

# Roadmap M3 will set this to "validate" once Flyway owns the schema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

logging.level.root=INFO
