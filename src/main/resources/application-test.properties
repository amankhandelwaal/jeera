# ─────────────────────────────────────────────────────────────────────────────
# Test profile. Used by @SpringBootTest / slice tests. The datasource is
# supplied dynamically by Testcontainers (@ServiceConnection) in integration
# tests (roadmap M2), so no DB URL is hardcoded here.
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Until Flyway is adopted (M3), let Hibernate build the schema in the test container.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
