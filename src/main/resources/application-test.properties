# ─────────────────────────────────────────────────────────────────────────────
# Test profile. Used by @SpringBootTest / slice tests. The datasource is
# supplied dynamically by Testcontainers (@ServiceConnection) in integration
# tests (roadmap M2), so no DB URL is hardcoded here.
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Flyway builds the schema in the fresh test container (db/migration/V*.sql);
# Hibernate then only validates the entity model against it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
