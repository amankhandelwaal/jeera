# ─────────────────────────────────────────────────────────────────────────────
# Jeera — base configuration (12-factor: every value is env-overridable).
# Safe local defaults let `mvn spring-boot:run` and `docker compose up` work
# out of the box. Profiles (dev/test/prod) and env vars override these.
# ─────────────────────────────────────────────────────────────────────────────
spring.application.name=jeera
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# ── Datasource (override via DB_* env vars in every real environment) ────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jeera_db}
spring.datasource.username=${DB_USERNAME:jeera_user}
spring.datasource.password=${DB_PASSWORD:yourpassword}

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# Flyway owns the schema (roadmap M3); Hibernate only validates that the entity
# model matches the migrated database. Override with JPA_DDL_AUTO if ever needed.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway (database migrations) ─────────────────────────────────────────────
# baseline-on-migrate adopts the existing (pre-Flyway) production schema as the
# v1 baseline WITHOUT running V1 against it; fresh databases (CI, new dev) are
# built from scratch by db/migration/V*.sql.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=pre-Flyway baseline

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ── Actuator (expose only health; enable liveness/readiness probe groups) ────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
